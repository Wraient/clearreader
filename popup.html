<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #141821; color: #e8ecf3; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  button.big { width: 100%; padding: 12px; font-size: 14px; font-weight: 700; border: none; border-radius: 10px;
    background: #2563eb; color: #fff; cursor: pointer; }
  button.big:hover { background: #1d4ed8; }
  .status { margin-top: 10px; font-size: 12px; color: #93a0b8; min-height: 16px; }
  .foot { margin-top: 12px; font-size: 12px; }
  .foot a { color: #7dd3fc; }
  .keys { margin-top: 8px; font-size: 11px; color: #5b6b8c; line-height: 1.6; }
  kbd { background: #1d2433; border: 1px solid #2a3348; border-radius: 4px; padding: 1px 5px; font-size: 10px; }
</style>
</head>
<body>
  <h1>ClearReader</h1>
  <button class="big" id="read">Read this article</button>
  <div class="status" id="status"></div>
  <div class="foot"><a href="#" id="opts">Options (API keys)</a></div>
  <div class="keys"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> read &nbsp; <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> play/pause</div>
  <script src="popup.js"></script>
</body>
</html>
